[package]
name = "ch03-cubecl-kernel"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

# CubeCL's low-level launch API requires the caller to prove raw buffer lengths.
# This crate contains the chapter's documented unsafe boundary and therefore
# intentionally does not inherit the workspace-wide `unsafe_code = "forbid"`.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
dbg_macro = "deny"
todo = "warn"

[features]
wgpu = ["cubecl/wgpu"]

[dependencies]
cubecl.workspace = true

