name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt

      - uses: peaceiris/actions-mdbook@ee69d230fe19748b7abf22df32acaa93833fad08 # v2
        with:
          mdbook-version: "0.4.51"

      - name: Validate committed snapshot metadata
        run: python3 tools/check_upstreams.py

      - name: Build book
        run: mdbook build book

      - name: Test book snippets
        run: mdbook test book

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-targets --locked

      - name: Run doctests
        run: cargo test --workspace --doc --locked

      - name: Fetch locked dependencies
        run: cargo fetch --locked

      - name: Check locked offline metadata
        run: cargo metadata --locked --offline --format-version 1 --no-deps

      - name: Run offline Clippy and tests
        run: |
          cargo clippy --workspace --all-targets --locked --offline -- -D warnings
          cargo test --workspace --all-targets --locked --offline
          cargo test --workspace --doc --locked --offline

      - name: Run CPU example smoke tests
        run: make smoke

      - name: Run P1 capstone
        run: make capstone-smoke

      - name: Run release audit
        run: python3 tools/check_release.py --require-built-book --offline-gate --json

