<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="system-ui, 'PingFang SC', 'Noto Sans CJK SC', sans-serif">
  <rect width="760" height="420" fill="#ffffff" stroke="#d1d5db" rx="6"/>
  <!-- Spine layer -->
  <g>
    <rect x="230" y="24" width="130" height="34" fill="#ede9fe" stroke="#8b5cf6" rx="4"/>
    <text x="295" y="46" text-anchor="middle" font-size="14" fill="#4c1d95">Spine 0</text>
    <rect x="400" y="24" width="130" height="34" fill="#ede9fe" stroke="#8b5cf6" rx="4"/>
    <text x="465" y="46" text-anchor="middle" font-size="14" fill="#4c1d95">Spine 1</text>
  </g>
  <!-- ToR layer -->
  <g>
    <rect x="150" y="130" width="130" height="34" fill="#e0e7ff" stroke="#6366f1" rx="4"/>
    <text x="215" y="152" text-anchor="middle" font-size="14" fill="#312e81">ToR A</text>
    <rect x="480" y="130" width="130" height="34" fill="#e0e7ff" stroke="#6366f1" rx="4"/>
    <text x="545" y="152" text-anchor="middle" font-size="14" fill="#312e81">ToR B</text>
  </g>
  <!-- ToR <-> Spine links (oversubscription risk) -->
  <g stroke="#dc2626" stroke-width="2">
    <line x1="230" y1="130" x2="280" y2="58"/>
    <line x1="245" y1="130" x2="450" y2="58"/>
    <line x1="530" y1="130" x2="310" y2="58"/>
    <line x1="545" y1="130" x2="480" y2="58"/>
  </g>
  <text x="380" y="92" text-anchor="middle" font-size="12" fill="#dc2626">共享上行链路：可能超额认购（oversubscription）</text>
  <!-- rack A nodes -->
  <g>
    <rect x="60" y="230" width="150" height="120" fill="#f8fafc" stroke="#64748b" rx="4"/>
    <text x="135" y="250" text-anchor="middle" font-size="13" fill="#1f2937">节点 A0</text>
    <rect x="72" y="262" width="28" height="22" fill="#dcfce7" stroke="#16a34a"/><text x="86" y="277" text-anchor="middle" font-size="10" fill="#14532d">G0</text>
    <rect x="104" y="262" width="28" height="22" fill="#dcfce7" stroke="#16a34a"/><text x="118" y="277" text-anchor="middle" font-size="10" fill="#14532d">G1</text>
    <rect x="136" y="262" width="28" height="22" fill="#dcfce7" stroke="#16a34a"/><text x="150" y="277" text-anchor="middle" font-size="10" fill="#14532d">G2</text>
    <rect x="168" y="262" width="28" height="22" fill="#dcfce7" stroke="#16a34a"/><text x="182" y="277" text-anchor="middle" font-size="10" fill="#14532d">G3</text>
    <rect x="72" y="292" width="124" height="20" fill="#fef9c3" stroke="#ca8a04"/><text x="134" y="306" text-anchor="middle" font-size="10" fill="#713f12">CPU / NUMA</text>
    <text x="135" y="336" text-anchor="middle" font-size="11" fill="#64748b">节点内：PCIe / 高速互连</text>

    <rect x="230" y="230" width="150" height="120" fill="#f8fafc" stroke="#64748b" rx="4"/>
    <text x="305" y="250" text-anchor="middle" font-size="13" fill="#1f2937">节点 A1</text>
    <rect x="242" y="262" width="28" height="22" fill="#dcfce7" stroke="#16a34a"/><text x="256" y="277" text-anchor="middle" font-size="10" fill="#14532d">G4</text>
    <rect x="274" y="262" width="28" height="22" fill="#dcfce7" stroke="#16a34a"/><text x="288" y="277" text-anchor="middle" font-size="10" fill="#14532d">G5</text>
    <rect x="306" y="262" width="28" height="22" fill="#dcfce7" stroke="#16a34a"/><text x="320" y="277" text-anchor="middle" font-size="10" fill="#14532d">G6</text>
    <rect x="338" y="262" width="28" height="22" fill="#dcfce7" stroke="#16a34a"/><text x="352" y="277" text-anchor="middle" font-size="10" fill="#14532d">G7</text>
    <rect x="242" y="292" width="124" height="20" fill="#fef9c3" stroke="#ca8a04"/><text x="304" y="306" text-anchor="middle" font-size="10" fill="#713f12">CPU / NUMA</text>
    <text x="305" y="336" text-anchor="middle" font-size="11" fill="#64748b">机柜内：ToR 下行</text>
  </g>
  <!-- rack B nodes -->
  <g>
    <rect x="420" y="230" width="150" height="120" fill="#f8fafc" stroke="#64748b" rx="4"/>
    <text x="495" y="250" text-anchor="middle" font-size="13" fill="#1f2937">节点 B0</text>
    <rect x="432" y="262" width="28" height="22" fill="#dcfce7" stroke="#16a34a"/><text x="446" y="277" text-anchor="middle" font-size="10" fill="#14532d">G8</text>
    <rect x="464" y="262" width="28" height="22" fill="#dcfce7" stroke="#16a34a"/><text x="478" y="277" text-anchor="middle" font-size="10" fill="#14532d">G9</text>
    <rect x="496" y="262" width="28" height="22" fill="#dcfce7" stroke="#16a34a"/><text x="510" y="277" text-anchor="middle" font-size="10" fill="#14532d">G10</text>
    <rect x="528" y="262" width="28" height="22" fill="#dcfce7" stroke="#16a34a"/><text x="542" y="277" text-anchor="middle" font-size="10" fill="#14532d">G11</text>
    <rect x="432" y="292" width="124" height="20" fill="#fef9c3" stroke="#ca8a04"/><text x="494" y="306" text-anchor="middle" font-size="10" fill="#713f12">CPU / NUMA</text>

    <rect x="590" y="230" width="150" height="120" fill="#f8fafc" stroke="#64748b" rx="4"/>
    <text x="665" y="250" text-anchor="middle" font-size="13" fill="#1f2937">节点 B1</text>
    <rect x="602" y="262" width="28" height="22" fill="#dcfce7" stroke="#16a34a"/><text x="616" y="277" text-anchor="middle" font-size="10" fill="#14532d">G12</text>
    <rect x="634" y="262" width="28" height="22" fill="#dcfce7" stroke="#16a34a"/><text x="648" y="277" text-anchor="middle" font-size="10" fill="#14532d">G13</text>
    <rect x="666" y="262" width="28" height="22" fill="#dcfce7" stroke="#16a34a"/><text x="680" y="277" text-anchor="middle" font-size="10" fill="#14532d">G14</text>
    <rect x="698" y="262" width="28" height="22" fill="#dcfce7" stroke="#16a34a"/><text x="712" y="277" text-anchor="middle" font-size="10" fill="#14532d">G15</text>
    <rect x="602" y="292" width="124" height="20" fill="#fef9c3" stroke="#ca8a04"/><text x="664" y="306" text-anchor="middle" font-size="10" fill="#713f12">CPU / NUMA</text>
  </g>
  <!-- node <-> ToR links -->
  <g stroke="#16a34a" stroke-width="2">
    <line x1="135" y1="230" x2="200" y2="164"/>
    <line x1="305" y1="230" x2="230" y2="164"/>
    <line x1="495" y1="230" x2="530" y2="164"/>
    <line x1="665" y1="230" x2="560" y2="164"/>
  </g>
  <!-- rack labels -->
  <rect x="60" y="368" width="320" height="30" fill="none" stroke="#94a3b8" stroke-dasharray="5 4" rx="4"/>
  <text x="220" y="388" text-anchor="middle" font-size="13" fill="#475569">机柜 A（同机柜通信成本较低）</text>
  <rect x="420" y="368" width="320" height="30" fill="none" stroke="#94a3b8" stroke-dasharray="5 4" rx="4"/>
  <text x="580" y="388" text-anchor="middle" font-size="13" fill="#475569">机柜 B</text>
</svg>
