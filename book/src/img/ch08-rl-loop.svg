<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" font-family="system-ui, 'PingFang SC', 'Noto Sans CJK SC', sans-serif">
  <rect width="700" height="320" fill="#ffffff" stroke="#d1d5db" rx="6"/>
  <g font-size="13" text-anchor="middle">
    <rect x="40" y="40" width="140" height="44" fill="#dbeafe" stroke="#3b82f6" rx="4"/>
    <text x="110" y="66" fill="#1e3a8a">Environment</text>
    <rect x="280" y="40" width="140" height="44" fill="#dcfce7" stroke="#16a34a" rx="4"/>
    <text x="350" y="66" fill="#14532d">Policy</text>
    <rect x="280" y="120" width="200" height="50" fill="#e0e7ff" stroke="#6366f1" rx="4"/>
    <text x="380" y="142" fill="#312e81">rollout / trajectory</text>
    <text x="380" y="160" fill="#4f46e5" font-size="11">next_state, reward, done, truncated</text>
    <rect x="40" y="220" width="180" height="44" fill="#ffedd5" stroke="#f97316" rx="4"/>
    <text x="130" y="246" fill="#7c2d12">on-policy recent batch</text>
    <rect x="280" y="220" width="160" height="44" fill="#fef3c7" stroke="#d97706" rx="4"/>
    <text x="360" y="246" fill="#78350f">replay buffer → sample</text>
    <rect x="520" y="220" width="140" height="44" fill="#fee2e2" stroke="#dc2626" rx="4"/>
    <text x="590" y="246" fill="#7f1d1d">learner / eval</text>
  </g>
  <g stroke="#6b7280" stroke-width="1.5" fill="#6b7280">
    <path d="M180 62 L278 62"/><polygon points="278,62 270,58 270,66"/>
    <text x="230" y="52" font-size="11" fill="#6b7280">state</text>
    <path d="M350 84 L350 118"/><polygon points="350,118 346,110 354,110"/>
    <text x="400" y="100" font-size="11" fill="#6b7280">action / step</text>
    <path d="M280 145 L110 145 L110 218"/><polygon points="110,218 106,210 114,210"/>
    <path d="M380 170 L360 218"/><polygon points="360,218 358,210 366,212"/>
    <path d="M220 242 L278 242"/><polygon points="278,242 270,238 270,246"/>
    <path d="M440 242 L518 242"/><polygon points="518,242 510,238 510,246"/>
  </g>
  <text x="350" y="300" text-anchor="middle" font-size="12" fill="#374151">burn-rl 提供组合抽象；完整 DQN/PPO/SAC 与跨节点 Actor–Learner 属未覆盖/可选</text>
</svg>