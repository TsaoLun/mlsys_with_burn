<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" font-family="system-ui, 'PingFang SC', 'Noto Sans CJK SC', sans-serif">
  <rect width="720" height="260" fill="#ffffff" stroke="#d1d5db" rx="6"/>
  <!-- producer chain -->
  <g font-size="13" text-anchor="middle">
    <rect x="30" y="60" width="110" height="46" fill="#dbeafe" stroke="#3b82f6" rx="4"/>
    <text x="85" y="80" fill="#1e3a8a">Load</text>
    <text x="85" y="96" fill="#3b5bdb" font-size="11">读取速率 F</text>
    <rect x="170" y="60" width="110" height="46" fill="#dbeafe" stroke="#3b82f6" rx="4"/>
    <text x="225" y="80" fill="#1e3a8a">Map</text>
    <text x="225" y="96" fill="#3b5bdb" font-size="11">变换速率 P</text>
    <!-- bounded queue -->
    <rect x="320" y="44" width="140" height="78" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5" rx="4"/>
    <text x="390" y="62" font-size="12" fill="#374151">有界队列（容量 ≤ Q）</text>
    <rect x="332" y="72" width="26" height="36" fill="#bfdbfe" stroke="#3b82f6"/>
    <rect x="362" y="72" width="26" height="36" fill="#bfdbfe" stroke="#3b82f6"/>
    <rect x="392" y="72" width="26" height="36" fill="#ffffff" stroke="#9ca3af" stroke-dasharray="3 3"/>
    <rect x="422" y="72" width="26" height="36" fill="#ffffff" stroke="#9ca3af" stroke-dasharray="3 3"/>
    <text x="345" y="94" font-size="10" fill="#1e3a8a">batch</text>
    <text x="375" y="94" font-size="10" fill="#1e3a8a">batch</text>
    <!-- consumer -->
    <rect x="510" y="60" width="140" height="46" fill="#dcfce7" stroke="#16a34a" rx="4"/>
    <text x="580" y="80" fill="#14532d">device compute</text>
    <text x="580" y="96" fill="#15803d" font-size="11">消费速率 G</text>
  </g>
  <!-- arrows -->
  <g stroke="#374151" stroke-width="1.5">
    <line x1="140" y1="83" x2="168" y2="83"/><polygon points="170,83 163,79 163,87" fill="#374151"/>
    <line x1="280" y1="83" x2="318" y2="83"/><polygon points="320,83 313,79 313,87" fill="#374151"/>
    <line x1="460" y1="83" x2="508" y2="83"/><polygon points="510,83 503,79 503,87" fill="#374151"/>
  </g>
  <text x="299" y="72" font-size="11" fill="#6b7280">enqueue</text>
  <text x="470" y="72" font-size="11" fill="#6b7280">dequeue</text>
  <!-- backpressure annotations -->
  <g font-size="12">
    <path d="M 390 122 L 390 160 L 225 160 L 225 150" fill="none" stroke="#dc2626" stroke-width="1.5"/>
    <polygon points="225,148 221,156 229,156" fill="#dc2626"/>
    <text x="300" y="176" fill="#dc2626">队列满 → 生产者等待（背压）</text>
    <path d="M 460 100 L 500 100 L 500 190 L 580 190 L 580 112" fill="none" stroke="#d97706" stroke-width="1.5"/>
    <polygon points="580,110 576,118 584,118" fill="#d97706"/>
    <text x="440" y="206" fill="#b45309">队列空 → 消费者（设备）等待</text>
  </g>
  <text x="360" y="240" text-anchor="middle" font-size="12" fill="#6b7280">设备不等待数据的条件近似为 G ≤ min(F, P)；队列只能吸收短时抖动</text>
</svg>
