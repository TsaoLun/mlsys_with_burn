<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="system-ui, 'PingFang SC', 'Noto Sans CJK SC', sans-serif">
  <rect width="640" height="360" fill="#ffffff" stroke="#d1d5db" rx="6"/>
  <!-- axes -->
  <line x1="70" y1="300" x2="600" y2="300" stroke="#374151" stroke-width="1.5"/>
  <line x1="70" y1="300" x2="70" y2="30" stroke="#374151" stroke-width="1.5"/>
  <polygon points="600,300 592,296 592,304" fill="#374151"/>
  <polygon points="70,30 66,38 74,38" fill="#374151"/>
  <text x="330" y="336" text-anchor="middle" font-size="14" fill="#1f2937">算术强度 I（FLOP / 字节）</text>
  <text x="30" y="170" text-anchor="middle" font-size="14" fill="#1f2937" transform="rotate(-90 30 170)">可达性能 P</text>
  <!-- bandwidth roof: P = I * Bmax -->
  <line x1="70" y1="300" x2="330" y2="110" stroke="#2563eb" stroke-width="2.5"/>
  <!-- compute roof: P = Pmax -->
  <line x1="330" y1="110" x2="600" y2="110" stroke="#ea580c" stroke-width="2.5"/>
  <!-- knee -->
  <circle cx="330" cy="110" r="4" fill="#111827"/>
  <line x1="330" y1="110" x2="330" y2="300" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="330" y="318" text-anchor="middle" font-size="13" fill="#111827">I* = Pmax / Bmax</text>
  <text x="345" y="98" font-size="13" fill="#111827">拐点</text>
  <!-- region labels -->
  <text x="150" y="230" font-size="13" fill="#2563eb" transform="rotate(-33 150 230)">P = I · Bmax（带宽受限区）</text>
  <text x="462" y="98" text-anchor="middle" font-size="13" fill="#ea580c">P = Pmax（计算受限区）</text>
  <!-- axis ticks -->
  <text x="60" y="304" text-anchor="end" font-size="12" fill="#6b7280">0</text>
  <text x="60" y="114" text-anchor="end" font-size="12" fill="#6b7280">Pmax</text>
</svg>
