<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="system-ui, 'PingFang SC', 'Noto Sans CJK SC', sans-serif">
  <rect width="720" height="300" fill="#ffffff" stroke="#d1d5db" rx="6"/>
  <text x="180" y="28" text-anchor="middle" font-size="13" fill="#1f2937">扇入图：a/b/c → d → e</text>
  <text x="540" y="28" text-anchor="middle" font-size="13" fill="#1f2937">长链：a → b → c → d → e</text>
  <!-- left fan-in -->
  <g font-size="13" text-anchor="middle">
    <rect x="40" y="50" width="50" height="30" fill="#dbeafe" stroke="#3b82f6" rx="3"/><text x="65" y="70" fill="#1e3a8a">a(0)</text>
    <rect x="40" y="95" width="50" height="30" fill="#dbeafe" stroke="#3b82f6" rx="3"/><text x="65" y="115" fill="#1e3a8a">b(0)</text>
    <rect x="40" y="140" width="50" height="30" fill="#dbeafe" stroke="#3b82f6" rx="3"/><text x="65" y="160" fill="#1e3a8a">c(0)</text>
    <rect x="160" y="95" width="50" height="30" fill="#e0e7ff" stroke="#6366f1" rx="3"/><text x="185" y="115" fill="#312e81">d(2)</text>
    <rect x="270" y="95" width="50" height="30" fill="#ffedd5" stroke="#f97316" rx="3"/><text x="295" y="115" fill="#7c2d12">e(1)</text>
  </g>
  <g stroke="#6b7280" stroke-width="1.5">
    <line x1="90" y1="65" x2="158" y2="105"/><line x1="90" y1="110" x2="158" y2="110"/>
    <line x1="90" y1="155" x2="158" y2="115"/><line x1="210" y1="110" x2="268" y2="110"/>
  </g>
  <text x="180" y="200" text-anchor="middle" font-size="12" fill="#dc2626">峰值：须同时保留 a/b/c</text>
  <text x="180" y="220" text-anchor="middle" font-size="12" fill="#6b7280">6 种合法拓扑序（3!）</text>
  <!-- right chain -->
  <g font-size="13" text-anchor="middle">
    <rect x="400" y="80" width="44" height="28" fill="#dbeafe" stroke="#3b82f6" rx="3"/><text x="422" y="98" fill="#1e3a8a">a</text>
    <rect x="460" y="80" width="44" height="28" fill="#dbeafe" stroke="#3b82f6" rx="3"/><text x="482" y="98" fill="#1e3a8a">b</text>
    <rect x="520" y="80" width="44" height="28" fill="#dbeafe" stroke="#3b82f6" rx="3"/><text x="542" y="98" fill="#1e3a8a">c</text>
    <rect x="580" y="80" width="44" height="28" fill="#e0e7ff" stroke="#6366f1" rx="3"/><text x="602" y="98" fill="#312e81">d</text>
    <rect x="640" y="80" width="44" height="28" fill="#ffedd5" stroke="#f97316" rx="3"/><text x="662" y="98" fill="#7c2d12">e</text>
  </g>
  <g stroke="#6b7280" stroke-width="1.5">
    <line x1="444" y1="94" x2="458" y2="94"/><line x1="504" y1="94" x2="518" y2="94"/>
    <line x1="564" y1="94" x2="578" y2="94"/><line x1="624" y1="94" x2="638" y2="94"/>
  </g>
  <text x="540" y="150" text-anchor="middle" font-size="12" fill="#16a34a">边算边释放：约 2 个活值</text>
  <text x="540" y="170" text-anchor="middle" font-size="12" fill="#6b7280">低效遍历可保留全部中间值</text>
  <rect x="40" y="250" width="640" height="36" fill="#f9fafb" stroke="#e5e7eb" rx="4"/>
  <text x="360" y="273" text-anchor="middle" font-size="12" fill="#374151">拓扑序保证正确性；峰值内存是调度决策的结果，不是图本身自动给出的最优解</text>
</svg>