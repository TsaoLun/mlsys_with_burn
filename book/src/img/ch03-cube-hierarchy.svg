<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="system-ui, 'PingFang SC', 'Noto Sans CJK SC', sans-serif">
  <rect width="640" height="340" fill="#ffffff" stroke="#d1d5db" rx="6"/>

  <!-- CubeCount ⊃ Cube ⊃ Plane ⊃ Unit；Plane 虚线表示协同分组 -->
  <g text-anchor="middle">
    <rect x="28" y="16" width="584" height="308" fill="#eff6ff" stroke="#3b82f6" rx="6" stroke-width="2"/>
    <text x="320" y="42" fill="#1e3a8a" font-size="15">CubeCount(x, y, z)</text>
    <text x="320" y="62" fill="#3b5bdb" font-size="12">一次 launch 的 cube 网格（对照 CUDA grid）</text>

    <rect x="56" y="78" width="528" height="230" fill="#eef2ff" stroke="#6366f1" rx="6" stroke-width="2"/>
    <text x="320" y="104" fill="#312e81" font-size="15">Cube / CubeDim(x, y, z)</text>
    <text x="320" y="124" fill="#4f46e5" font-size="12">可协作并共享资源的工作组（对照 block）</text>

    <rect x="96" y="144" width="448" height="140" fill="#fdf2f8" stroke="#db2777" rx="6" stroke-width="2" stroke-dasharray="7 4"/>
    <text x="320" y="170" fill="#831843" font-size="14">Plane</text>
    <text x="320" y="190" fill="#be185d" font-size="12">相邻 Unit 的协同子集（对照 warp；Cube 内通常有多个）</text>

    <rect x="148" y="208" width="344" height="54" fill="#ede9fe" stroke="#8b5cf6" rx="4" stroke-width="1.5"/>
    <text x="320" y="232" fill="#4c1d95" font-size="14">Unit</text>
    <text x="320" y="250" fill="#7c3aed" font-size="12">执行 Kernel 的逻辑工作项（对照 thread）</text>
  </g>
</svg>
