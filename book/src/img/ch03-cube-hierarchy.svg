<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="system-ui, 'PingFang SC', 'Noto Sans CJK SC', sans-serif">
  <rect width="640" height="300" fill="#ffffff" stroke="#d1d5db" rx="6"/>
  <g font-size="14" text-anchor="middle">
    <rect x="40" y="30" width="560" height="50" fill="#dbeafe" stroke="#3b82f6" rx="4"/>
    <text x="320" y="52" fill="#1e3a8a">CubeCount(x, y, z)</text>
    <text x="320" y="70" fill="#3b5bdb" font-size="11">一次 launch 的 cube 网格（对照 CUDA grid）</text>
    <rect x="80" y="100" width="480" height="50" fill="#e0e7ff" stroke="#6366f1" rx="4"/>
    <text x="320" y="122" fill="#312e81">Cube / CubeDim(x, y, z)</text>
    <text x="320" y="140" fill="#4f46e5" font-size="11">可协作并共享资源的工作组（对照 block）</text>
    <rect x="120" y="170" width="400" height="50" fill="#ede9fe" stroke="#8b5cf6" rx="4"/>
    <text x="320" y="192" fill="#4c1d95">Unit</text>
    <text x="320" y="210" fill="#7c3aed" font-size="11">执行 Kernel 实例的逻辑工作项（对照 thread）</text>
    <rect x="135" y="240" width="370" height="40" fill="#fce7f3" stroke="#db2777" rx="4"/>
    <text x="320" y="265" fill="#831843">Plane：相邻 Unit 的协同子集（对照 warp，大小不固定）</text>
  </g>
</svg>