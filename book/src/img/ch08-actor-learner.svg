<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" font-family="system-ui, 'PingFang SC', 'Noto Sans CJK SC', sans-serif">
  <defs>
    <marker id="arr8" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/>
    </marker>
    <marker id="arr8b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#8b5cf6"/>
    </marker>
  </defs>
  <rect width="720" height="260" fill="#ffffff" stroke="#d1d5db" rx="6"/>
  <g font-size="13" text-anchor="middle">
    <rect x="30" y="70" width="170" height="100" fill="#dcfce7" stroke="#16a34a" rx="4"/>
    <text x="115" y="102" fill="#14532d">Actor / 环境 ×N</text>
    <text x="115" y="122" font-size="11" fill="#166534">与环境交互、产生轨迹</text>
    <rect x="300" y="30" width="180" height="60" fill="#dbeafe" stroke="#3b82f6" rx="4"/>
    <text x="390" y="55" fill="#1e3a8a">推理服务</text>
    <text x="390" y="74" font-size="11" fill="#1e40af">batched Policy inference</text>
    <rect x="300" y="160" width="180" height="60" fill="#ffedd5" stroke="#f97316" rx="4"/>
    <text x="390" y="185" fill="#7c2d12">Replay / 轨迹队列</text>
    <text x="390" y="204" font-size="11" fill="#9a3412">背压、年龄、采样</text>
    <rect x="550" y="95" width="140" height="70" fill="#ede9fe" stroke="#8b5cf6" rx="4"/>
    <text x="620" y="123" fill="#5b21b6">Learner</text>
    <text x="620" y="142" font-size="11" fill="#6d28d9">更新参数与版本</text>
  </g>
  <g stroke="#6b7280" stroke-width="1.5" fill="none">
    <path d="M200,95 C240,70 260,62 298,60" marker-end="url(#arr8)"/>
    <path d="M300,78 C260,84 240,92 202,112" marker-end="url(#arr8)"/>
    <path d="M200,150 C240,170 260,182 298,188" marker-end="url(#arr8)"/>
    <line x1="480" y1="190" x2="560" y2="150" marker-end="url(#arr8)"/>
  </g>
  <path d="M550,110 C520,86 500,70 482,62" stroke="#8b5cf6" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#arr8b)"/>
  <g font-size="11" fill="#4b5563">
    <text x="234" y="52">observations</text>
    <text x="240" y="106">actions</text>
    <text x="216" y="182">transitions</text>
    <text x="512" y="182">sample batch</text>
    <text x="470" y="46" fill="#6d28d9">policy version 下发</text>
  </g>
  <text x="30" y="246" font-size="12" fill="#6b7280">三方各自的速率不同：版本差（policy lag）、队列背压与采样新鲜度由此产生</text>
</svg>
