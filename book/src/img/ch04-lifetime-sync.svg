<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="system-ui, 'PingFang SC', 'Noto Sans CJK SC', sans-serif">
  <rect width="720" height="320" fill="#ffffff" stroke="#d1d5db" rx="6"/>
  <text x="20" y="28" font-size="13" fill="#1f2937">融合执行：中间值 mid 只活在融合块内部</text>
  <g font-size="12" fill="#6b7280">
    <text x="640" y="46">时间 →</text>
    <text x="40" y="70" text-anchor="end" fill="#1f2937">left</text>
    <text x="40" y="94" text-anchor="end" fill="#1f2937">right</text>
    <text x="40" y="118" text-anchor="end" fill="#1f2937">mid</text>
    <text x="40" y="142" text-anchor="end" fill="#1f2937">out</text>
  </g>
  <g>
    <rect x="60"  y="58" width="140" height="16" fill="#dbeafe" stroke="#3b82f6"/>
    <rect x="60"  y="82" width="140" height="16" fill="#dbeafe" stroke="#3b82f6"/>
    <rect x="200" y="106" width="46" height="16" fill="#fef9c3" stroke="#ca8a04"/>
    <text x="252" y="119" font-size="11" fill="#854d0e">仅块内临时，可能不单独暴露</text>
    <rect x="246" y="130" width="180" height="16" fill="#dcfce7" stroke="#16a34a"/>
  </g>
  <line x1="20" y1="166" x2="700" y2="166" stroke="#e5e7eb"/>
  <text x="20" y="192" font-size="13" fill="#1f2937">中途 Device::sync()：中间值必须物化，寿命被拉长</text>
  <g font-size="12" fill="#6b7280">
    <text x="40" y="226" text-anchor="end" fill="#1f2937">left</text>
    <text x="40" y="250" text-anchor="end" fill="#1f2937">right</text>
    <text x="40" y="274" text-anchor="end" fill="#1f2937">mid</text>
    <text x="40" y="298" text-anchor="end" fill="#1f2937">out</text>
  </g>
  <g>
    <rect x="60"  y="214" width="140" height="16" fill="#dbeafe" stroke="#3b82f6"/>
    <rect x="60"  y="238" width="140" height="16" fill="#dbeafe" stroke="#3b82f6"/>
    <rect x="200" y="262" width="240" height="16" fill="#ffedd5" stroke="#f97316"/>
    <text x="448" y="275" font-size="11" fill="#7c2d12">同步边界强制物化，复用窗口被切开</text>
    <rect x="330" y="286" width="200" height="16" fill="#dcfce7" stroke="#16a34a"/>
  </g>
  <line x1="330" y1="200" x2="330" y2="310" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="336" y="210" font-size="12" fill="#ef4444">sync</text>
</svg>
