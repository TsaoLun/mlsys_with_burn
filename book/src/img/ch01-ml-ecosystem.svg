<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-label="机器学习框架在生态中的位置">
  <style>
    .box { fill:#f7f7f5; stroke:#2c2c2c; stroke-width:1.5; }
    .hub { fill:#eef3f8; stroke:#2c2c2c; stroke-width:2; }
    .t { font-family: system-ui, sans-serif; font-size:13px; fill:#1a1a1a; }
    .s { font-family: system-ui, sans-serif; font-size:11px; fill:#444; }
    .arr { stroke:#2c2c2c; stroke-width:1.5; fill:none; marker-end:url(#m); }
    .arr2 { stroke:#2c2c2c; stroke-width:1.5; fill:none; marker-end:url(#m); marker-start:url(#ms); }
  </style>
  <defs>
    <marker id="m" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2c2c2c"/>
    </marker>
    <marker id="ms" markerWidth="8" markerHeight="8" refX="0" refY="3" orient="auto">
      <path d="M6,0 L0,3 L6,6 Z" fill="#2c2c2c"/>
    </marker>
  </defs>

  <rect class="box" x="280" y="20" width="160" height="40" rx="4"/>
  <text class="t" x="332" y="45">数据平台</text>
  <path class="arr" d="M360 60 V104"/>

  <rect class="box" x="40" y="108" width="150" height="40" rx="4"/>
  <text class="t" x="89" y="133">模型交换</text>
  <path class="arr" d="M190 128 H276"/>

  <rect class="hub" x="280" y="108" width="160" height="40" rx="4"/>
  <text class="t" x="318" y="133">机器学习框架</text>

  <rect class="box" x="530" y="108" width="160" height="40" rx="4"/>
  <text class="t" x="546" y="133">加速器编译与运行时</text>
  <path class="arr2" d="M444 128 H526"/>

  <path class="arr" d="M320 148 L160 208"/>
  <path class="arr" d="M360 148 V208"/>
  <path class="arr" d="M400 148 L560 208"/>

  <rect class="box" x="90" y="212" width="140" height="40" rx="4"/>
  <text class="t" x="134" y="237">模型服务</text>
  <rect class="box" x="290" y="212" width="140" height="40" rx="4"/>
  <text class="t" x="334" y="237">强化学习</text>
  <rect class="box" x="490" y="212" width="140" height="40" rx="4"/>
  <text class="t" x="534" y="237">训练平台</text>

  <path class="arr" d="M160 252 L300 306"/>
  <path class="arr" d="M560 252 L420 306"/>
  <rect class="box" x="290" y="300" width="140" height="40" rx="4"/>
  <text class="t" x="327" y="325">集群与观测</text>

  <text class="s" x="40" y="292">框架位于生态中心，</text>
  <text class="s" x="40" y="308">但不是完整产品系统</text>
  <text class="s" x="40" y="324">的中心。</text>
</svg>
