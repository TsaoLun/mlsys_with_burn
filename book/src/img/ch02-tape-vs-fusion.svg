<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 0 720 280" role="img" aria-label="autodiff tape versus Fusion IR">
  <style>
    .box { fill:#f7f7f5; stroke:#2c2c2c; stroke-width:1.5; }
    .box2 { fill:#eef3f8; stroke:#2c2c2c; stroke-width:1.5; }
    .t { font-family: system-ui, sans-serif; font-size:13px; fill:#1a1a1a; }
    .h { font-family: system-ui, sans-serif; font-size:14px; font-weight:600; fill:#1a1a1a; }
    .s { font-family: system-ui, sans-serif; font-size:11px; fill:#444; }
    .arr { stroke:#2c2c2c; stroke-width:1.5; fill:none; marker-end:url(#m); }
  </style>
  <defs>
    <marker id="m" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2c2c2c"/>
    </marker>
  </defs>
  <text class="h" x="40" y="32">autodiff tape（第 2 章）</text>
  <rect class="box" x="40" y="48" width="280" height="180" rx="4"/>
  <text class="t" x="56" y="80">记录实际执行的反向依赖</text>
  <text class="t" x="56" y="108">由 require_grad / backward 驱动</text>
  <text class="t" x="56" y="136">生命周期到一次 backward 为止</text>
  <text class="s" x="56" y="168">目的：产生梯度，不是设备 Kernel</text>
  <text class="s" x="56" y="192">Flex eager 默认路径也使用它</text>

  <text class="h" x="400" y="32">Fusion IR / 计划（第 4 章）</text>
  <rect class="box2" x="400" y="48" width="280" height="180" rx="4"/>
  <text class="t" x="416" y="80">暂存可融合的 Tensor 操作</text>
  <text class="t" x="416" y="108">由 OperationIr / stream 组织</text>
  <text class="t" x="416" y="136">同步或读回会切分计划</text>
  <text class="s" x="416" y="168">目的：减少 launch 与中间读写</text>
  <text class="s" x="416" y="192">经 CubeCL Runtime 编译执行</text>

  <path class="arr" d="M320 138 H390"/>
  <text class="s" x="318" y="128">不同目的</text>
</svg>
