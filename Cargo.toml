[workspace]
members = [
    "examples/ch01-stack-probe",
    "examples/ch02-ch04-op-anatomy",
    "examples/ch02-mini-autodiff",
    "examples/ch02-tensor-basics",
    "examples/ch03-cubecl-kernel",
    "examples/ch03-gemm-ladder",
    "examples/ch03-tile-loads",
    "examples/ch04-fusion-inspector",
    "examples/ch04-mini-pass-pipeline",
    "examples/ch05-data-pipeline",
    "examples/ch05-ch07-capstone",
    "examples/ch06-training-loop",
    "examples/ch06-parallel-strategies",
    "examples/ch07-ptq-calibration",
    "examples/ch07-record-roundtrip",
    "examples/ch07-serving-queue-sim",
    "examples/ch08-rl-rollout",
    "examples/ch09-cluster-simulator",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
rust-version = "1.95"

[workspace.dependencies]
# Build and CI always resolve Burn from GitHub. The revision identifies the
# 0.22.0-pre.3 writing snapshot; Burn's own manifest pins CubeCL and CubeK.
# Local source mirrors are intentionally never wired through `path`.
burn = { git = "https://github.com/tracel-ai/burn.git", rev = "13f0a12b71ad83c1f9edeac22dea325dcb612397", default-features = false, features = ["std", "flex", "autodiff"] }
burn-fusion = { git = "https://github.com/tracel-ai/burn.git", rev = "13f0a12b71ad83c1f9edeac22dea325dcb612397", default-features = false }
cubecl = { git = "https://github.com/tracel-ai/cubecl", rev = "b566e954468010303cf41465fc8b6be6499e2001", default-features = false, features = ["std", "stdlib", "cpu"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "warn"

