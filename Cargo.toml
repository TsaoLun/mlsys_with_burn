[workspace]
members = [
    "examples/ch01-stack-probe",
    "examples/ch02-tensor-basics",
    "examples/ch03-cubecl-kernel",
    "examples/ch03-tile-loads",
    "examples/ch04-fusion-inspector",
    "examples/ch05-data-pipeline",
    "examples/ch06-training-loop",
    "examples/ch07-record-roundtrip",
    "examples/ch08-rl-rollout",
    "examples/ch09-cluster-simulator",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
rust-version = "1.95"

[workspace.dependencies]
# Build and CI always resolve Burn from GitHub. The revision identifies the
# 0.22.0-pre.1 writing snapshot; Burn's own manifest pins CubeCL and CubeK.
# Local source mirrors are intentionally never wired through `path`.
burn = { git = "https://github.com/tracel-ai/burn.git", rev = "976aa9c5ec1d2dd3412710f99759e3c44bdff03d", default-features = false, features = ["std", "flex", "autodiff"] }
burn-fusion = { git = "https://github.com/tracel-ai/burn.git", rev = "976aa9c5ec1d2dd3412710f99759e3c44bdff03d", default-features = false }
cubecl = { git = "https://github.com/tracel-ai/cubecl", rev = "be278a1e76aed881e2cc6b165414ee6103ca4634", default-features = false, features = ["std", "stdlib", "cpu"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "warn"

